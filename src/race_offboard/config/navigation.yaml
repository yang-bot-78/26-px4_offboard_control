offboard_waypoint_node:
  ros__parameters:
    control_source: navigation
    navigation_setpoint_topic: /race/navigation_setpoint
    ego_setpoint_topic: /race/ego/trajectory_setpoint
    ego_setpoint_timeout_sec: 0.20
    required_setpoint_frame: px4_ned
    setpoint_timeout_sec: 0.8
    idle_hold_enabled: true
    trajectory_timeout: 0.50
    hold_position_tolerance: 0.05
    hold_velocity_tolerance: 0.05
    goal_reached_position_tolerance: 0.10
    goal_reached_velocity_tolerance: 0.08
    goal_update_position_tolerance_m: 0.05
    require_global_planner_final_goal: false
    braking_max_acc: 0.50
    hold_replan_distance: 0.08

    allow_dead_reckoning_takeoff: false
    require_strict_local_position_health: true
    # External-vision gate. EKF2's position comes from FAST-LIO through
    # /mavros/vision_pose/pose_cov, so arming requires a continuously healthy
    # EV chain and a post-takeoff FAULT normally requests AUTO.LAND. During
    # vertical takeoff the pilot remains responsible for the response.
    # Individual flight procedures may disable AUTO.LAND but must keep RC takeover ready.
    require_ev_health: true
    ev_health_topic: /ev_health/status
    ev_flight_ready_topic: /ev_health/flight_ready
    ev_health_required_s: 7.5
    ev_health_freshness_s: 0.5
    ev_fault_auto_land: true
    # A stale LiDAR posterior still permits a fresh IMU-propagated PX4 EV
    # stream with inflated covariance. Stop accepting aggressive trajectories
    # and brake to hold instead of creating an EV transport dropout.
    #
    # The hold is recoverable: it stops trajectory intake but does NOT cancel
    # the goal. When FR-LIO reports a usable planner state again and the vehicle
    # has been stationary for frlio_hold_release_stable_sec, planning resumes
    # from a freshly validated trajectory. Set frlio_hold_release_enabled=false
    # to require an explicit operator restart instead (the previous behaviour).
    frlio_status_topic: /frlio/high_rate_odom/status
    frlio_planner_usable_topic: /frlio/high_rate_odom/planner_usable
    frlio_fault_hold_enabled: true
    frlio_hold_release_enabled: true
    frlio_hold_release_stable_sec: 1.0
    # A missing FR-LIO status holds the planner (we cannot tell whether planning
    # is safe) but never interrupts EV: the EV chain has its own freshness gate
    # and PX4 EKF2 has its own EV timeout.
    frlio_status_timeout_sec: 0.5
    # A discontinuous PX4 local frame may be adopted only while disarmed and
    # IDLE, after the replacement frame remains still inside these limits.
    local_origin_rebase_stabilization_sec: 1.0
    local_origin_rebase_max_spread_m: 0.08
    local_origin_rebase_max_speed_mps: 0.20
    # PX4 emits paired MAVROS DEBUG_VECT reset metadata: PX4_XY_RST carries
    # delta_xy/xy_reset_counter and PX4_Z_RST carries delta_z/z_reset_counter.
    px4_local_reset_topic: /mavros/debug_value/debug_vector
    # Only the immediately following MAVROS local-pose sample can cross a
    # reset, and it must match both the XY and Z deltas.
    px4_local_pose_reset_match_window_sec: 0.35
    px4_local_pose_reset_xy_tolerance_m: 0.10
    px4_local_pose_reset_z_tolerance_m: 0.10
    ekf_xy_wait_timeout_sec: 3.0
    offboard_warmup_sec: 2.0
    preflight_stabilization_sec: 5.0
    command_retry_period_sec: 1.0

    cruise_altitude_m: 0.78
    takeoff_complete_height_m: 0.55
    min_command_height_m: 0.50
    max_command_height_m: 0.90
    overheight_guard_margin_m: 0.20
    emergency_overheight_margin_m: 0.35
    # force_arm_in_sim (PX4 magic 21196) is deliberately gone: on the real
    # aircraft, arming must respect PX4's preflight checks.
