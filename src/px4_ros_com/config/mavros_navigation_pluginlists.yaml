/**:
  ros__parameters:
    # 只加载 FAST-LIO EV 与本项目 Offboard 导航实际使用的 MAVROS 插件。
    # 全量插件在当前机载机上初始化超过 90 秒，会导致启动脚本误判连接超时。
    plugin_allowlist:
      - command
      # PX4 local-position reset events use the standard DEBUG_VECT message
      # and are decoded directly by MAVROS' debug_value plugin.
      # Keep debug_value enabled because navigation consumes that stable ROS
      # interface, while the reset event itself no longer depends on uXRCE DDS.
      - debug_value
      - imu
      - local_position
      - odometry
      # Required only for the POSITION preflight's read-only EKF2_EV_CTRL
      # check. The flight scripts never call the ParamSet service.
      - param
      - setpoint_raw
      - sys_status
      - sys_time
