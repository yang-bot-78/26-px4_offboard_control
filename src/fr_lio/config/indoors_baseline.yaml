/**:
  ros__parameters:
    odom_frame: "odom"
    body_frame: "body"
    feature_extract_enable: false
    point_filter_num: 6
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    map_file_path: "./test.pcd"
    common:
      lid_topic: "/livox/lidar"
      imu_topic: "/livox/imu"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0
    imu:
      acceleration_unit: "g"
      unit_report_duration_s: 10.0
    high_rate_odom:
      enabled: true
      warn_anchor_age_s: 0.15
      max_anchor_age_s: 0.40
      imu_history_s: 5.0
    preprocess:
      lidar_type: 1
      scan_line: 4
      blind: 0.5
      timestamp_unit: 3
      scan_rate: 10
    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 15.0
      extrinsic_est_en: false
      use_scan_to_scan_cov: false
      use_perpoint_cov: false
      enable_shadow_map: false
      enable_map_correction: false
      correct_working_tree: false
      extrinsic_T: [-0.011, -0.02329, 0.04412]
      extrinsic_R: [1., 0., 0., 0., 1., 0., 0., 0., 1.]
    lc:
      enable: false
    publish:
      odom_topic: "/Odometry"
      odom_unfiltered_topic: "/Odometry/unfiltered"
      map_odom_topic: "/Odometry/map"
      path_en: true
      effect_map_en: false
      map_en: true
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: true
      tf_en: true
      unfiltered_odom_en: false
    pcd_save:
      pcd_save_en: false
      interval: -1
