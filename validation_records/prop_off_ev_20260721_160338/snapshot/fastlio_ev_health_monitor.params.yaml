/fastlio_ev_health_monitor:
  ros__parameters:
    anomaly_to_fault_s: 0.3
    diagnostic_topic: /ev_health/diagnostics
    effective_points_ok_topic: ''
    effective_points_timeout_s: 0.5
    fault_topic: /ev_health/fault
    healthy_orientation_variance_floor_rad2: 0.02
    healthy_position_variance_floor_m2: 0.01
    input_topic: /Odometry
    max_dt_s: 0.5
    max_future_stamp_s: 0.05
    max_horizontal_velocity_difference_mps: 0.45
    max_input_age_s: 0.25
    max_position_jump_m: 0.15
    max_velocity_alignment_s: 0.1
    message_timeout_s: 0.5
    min_dt_s: 0.001
    output_topic: /Odometry/healthy
    position_yaw_offset_rad: 0.0
    px4_local_odom_topic: /mavros/local_position/odom
    px4_velocity_max_future_stamp_s: 0.05
    px4_velocity_max_input_age_s: 0.25
    px4_velocity_timeout_s: 0.5
    px4_velocity_topic: /mavros/local_position/velocity_local
    recovery_healthy_s: 7.5
    stationary_speed_deadband_mps: 0.02
    status_topic: /ev_health/status
    suspect_covariance_multiplier: 100.0
    use_local_odom_velocity_fallback: false
    use_sim_time: false
    velocity_diagnostic_topic: /ev_health/velocity_ned
    velocity_difference_min_speed_mps: 0.05
    velocity_history_s: 3.0
    velocity_lowpass_cutoff_hz: 3.0
    velocity_variance_m2ps2: 0.04

