# MID360 / FAST-LIO lever arm for the production start_takeoff_1m_stack.sh path.
# Measure from the aircraft control center (or chosen control origin) to the
# FAST-LIO pose origin (the IMU state origin) in aircraft body FLU:
# +X forward, +Y left, +Z up. Do not add mid360.yaml extrinsic_T again. If the
# physical measurement ends at a LiDAR datum, convert it to the IMU pose origin
# exactly once using that calibrated LiDAR-to-IMU extrinsic.
# The 2026-08-07 propeller-off roll/pitch fit places the FAST-LIO pose origin
# about 0.08 m above the control center. Bag mid360_axis_20260807_105923 then
# left a 0.0626 m yaw-correlated horizontal circle. Its one-run horizontal fit
# was not adopted because the data cannot separate physical lever arm from
# operator pivot motion. Keep X/Y at zero until a fixed-pivot repeat resolves
# that ambiguity. The tested 0.8 m Z was a decimal-place error.
# The 2026-08-12 live RViz/odometry check showed FAST-LIO body +X pointing to
# the aircraft's physical right. Under q_W_B = q_W_F * q_F_B this requires
# q_F_B = Rz(+pi/2) to recover the physical base_link forward axis. The same
# value is consumed by the vision bridge, /race/odom bridge and static TF.
# R_FASTLIO_body rotates body vectors into FAST-LIO coordinates.
# YAW_VERIFIED=1 records this direct physical-axis observation; it does not
# close the independent horizontal lever-arm residual above.
MID360_LEVER_ARM_CALIBRATED=1
MID360_INSTALLATION_YAW_VERIFIED=1
MID360_BODY_TO_SENSOR_X_M=0.0
MID360_BODY_TO_SENSOR_Y_M=0.0
MID360_BODY_TO_SENSOR_Z_M=0.08
MID360_BODY_TO_FASTLIO_YAW_RAD=1.5707963267948966
